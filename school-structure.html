<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHTMS School Structure</title><style>body{font-family:Arial,sans-serif;background:#f5f8f7;margin:0;color:#17352f}header{background:#0d6656;color:white;padding:18px}.wrap{max-width:1150px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top a{background:white;color:#0d6656;padding:10px 14px;border-radius:9px;text-decoration:none}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.tabs button{border:1px solid #cbd9d5;background:white;padding:10px 14px;border-radius:9px;cursor:pointer}.tabs button.active{background:#0d6656;color:white}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:white;border:1px solid #d8e5e1;border-radius:14px;padding:18px;box-shadow:0 4px 16px #00000008}label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd9d5;border-radius:8px}button.save{width:100%;padding:11px;border:0;border-radius:8px;background:#0d6656;color:white;margin-top:14px}.clear{width:100%;padding:11px;border:0;border-radius:8px;background:#edf4f1;margin-top:8px}.msg{font-size:12px;margin-top:10px;min-height:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4ece9;font-size:13px}th{background:#f1f7f4}.act{display:flex;gap:6px}.act button{border:0;border-radius:7px;padding:7px 9px;cursor:pointer}.edit{background:#e7f2ef;color:#0d6656}.del{background:#f7e8e7;color:#9a3029}.hidden{display:none}.muted{font-size:12px;color:#d9eee8}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="wrap top"><div><h1>SHTMS School Structure</h1><div class="muted">Central master records: Faculty → Department → Programme → Course</div></div><a href="admin.html">← Admin Center</a></div></header><main class="wrap"><div class="tabs" id="tabs"></div><div id="app"></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDfHJaoV7eQKWWq71zn2bQOpR4Vot9v8c',authDomain:'smsh-282c0.firebaseapp.com',projectId:'smsh-282c0',storageBucket:'smsh-282c0.firebasestorage.app',messagingSenderId:'477828256463',appId:'1:80a6755b679f585c73ddba'};
// Correct app id is restored below for this project.
firebaseConfig.appId='1:477828256463:web:80a6755b679f585c73ddba';
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const configs={faculties:{label:'Faculties',collection:'faculties',fields:[['code','Faculty Code'],['name','Faculty Name'],['description','Description']]},departments:{label:'Departments',collection:'departments',parent:'faculties',parentLabel:'Faculty',fields:[['code','Department Code'],['name','Department Name'],['description','Description']]},programmes:{label:'Programmes',collection:'programmes',parent:'departments',parentLabel:'Department',fields:[['code','Programme Code'],['name','Programme Name'],['award','Award / Qualification']]},levels:{label:'Levels',collection:'levels',fields:[['code','Level Code'],['name','Level Name']]},courses:{label:'Courses',collection:'courses',parent:'programmes',parentLabel:'Programme',fields:[['code','Course Code'],['name','Course Name'],['creditUnit','Credit Units'],['semester','Semester'],['level','Level']]}};
let current='faculties',editing=null,records=[];
Object.entries(configs).forEach(([k,c])=>{const b=document.createElement('button');b.textContent=c.label;b.onclick=()=>show(k);b.dataset.key=k;$('tabs').appendChild(b)});
async function parents(c){if(!c.parent)return'';const s=await getDocs(collection(db,c.parent));return '<label>'+c.parentLabel+'</label><select id="parentId"><option value="">Select '+c.parentLabel+'</option>'+s.docs.map(d=>'<option value="'+d.id+'">'+esc(d.data().name||d.id)+'</option>').join('')+'</select>'}
async function show(key){current=key;editing=null;const c=configs[key];document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));const pf=await parents(c);$('app').innerHTML='<div class="grid"><section class="card"><h2>Create / Edit</h2><form id="form">'+pf+c.fields.map(f=>'<label>'+f[1]+'</label><input id="'+f[0]+'" placeholder="'+f[1]+'">').join('')+'<button class="save" id="save">Create</button><button type="button" class="clear" id="clear">Clear</button><div class="msg" id="msg"></div></form></section><section class="card"><h2>'+c.label+'</h2><div class="tablewrap"><table><thead><tr>'+c.fields.map(f=>'<th>'+f[1]+'</th>').join('')+'<th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>';$('form').onsubmit=save;$('clear').onclick=clear;await load()}
async function load(){const c=configs[current],s=await getDocs(collection(db,c.collection));records=s.docs.map(d=>({_id:d.id,...d.data()}));$('rows').innerHTML=records.length?records.map(r=>'<tr>'+c.fields.map(f=>'<td>'+esc(r[f[0]])+'</td>').join('')+'<td><div class="act"><button class="edit" onclick="editRec(\''+r._id+'\')">Edit</button><button class="del" onclick="delRec(\''+r._id+'\')">Delete</button></div></td></tr>').join(''):'<tr><td colspan="'+(c.fields.length+1)+'" style="text-align:center;padding:30px">No records yet.</td></tr>'}
async function save(e){e.preventDefault();const c=configs[current];$('save').disabled=true;$('msg').textContent='Saving...';try{const data={};c.fields.forEach(f=>data[f[0]]=$(f[0]).value.trim());if(c.parent){data.parentId=$('parentId').value;if(!data.parentId)throw Error('Please select '+c.parentLabel+'.')}if(editing){data.updatedAt=serverTimestamp();await updateDoc(doc(db,c.collection,editing),data)}else{data.createdAt=serverTimestamp();data.status='Active';await addDoc(collection(db,c.collection),data)}clear();$('msg').textContent='Saved successfully.';await load()}catch(err){$('msg').textContent=err.message||'Could not save.'}finally{$('save').disabled=false}}
window.editRec=id=>{const r=records.find(x=>x._id===id),c=configs[current];if(!r)return;editing=id;c.fields.forEach(f=>$(f[0]).value=r[f[0]]??'');if(c.parent)$('parentId').value=r.parentId??'';$('save').textContent='Update';window.scrollTo({top:0,behavior:'smooth'})};window.delRec=async id=>{if(confirm('Delete this record?')){await deleteDoc(doc(db,configs[current].collection,id));await load()}};function clear(){$('form').reset();editing=null;$('save').textContent='Create'}onAuthStateChanged(auth,async user=>{if(!user){location.href='index.html';return}show(current)});
</script></body></html>
