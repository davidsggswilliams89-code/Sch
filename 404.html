<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHTMS | Page Not Found</title>
<style>
:root{--primary:#0b6b57;--dark:#064d3f;--text:#17302d;--muted:#687a76;--border:#dbe7e3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e9f4f0,#f8fbfa);display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text)}
.card{width:100%;max-width:620px;background:#fff;border-radius:22px;padding:42px 34px;box-shadow:0 20px 55px rgba(18,54,47,.14);text-align:center}
.logo{width:68px;height:68px;border-radius:18px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 20px}
.code{font-size:64px;font-weight:800;color:var(--primary);margin:0}.title{font-size:27px;margin:8px 0 10px}.text{color:var(--muted);line-height:1.6;margin:0 auto 20px;max-width:500px}
.request{display:none;background:#f5f9f7;border:1px solid var(--border);border-radius:10px;padding:12px;margin:18px 0;color:var(--muted);font-size:13px;word-break:break-all;text-align:left}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;font-size:15px}.primary{background:var(--primary);color:#fff}.secondary{background:#eef5f2;color:var(--dark)}
.note{margin-top:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">S</div>
  <p class="code">404</p>
  <h1 class="title">Page not found</h1>
  <p class="text">The SHTMS page you requested does not exist at this address. This is a missing-page error, not an administrator access error.</p>
  <div id="request" class="request"></div>
  <div class="actions">
    <a id="back" class="btn primary" href="index.html">Go to Login</a>
    <a class="btn secondary" href="index.html">Return to SHTMS</a>
  </div>
  <p class="note">If you followed a link inside SHTMS, the page filename or module link may need to be corrected.</p>
</main>
<script>
(function(){
  const requested=location.pathname.split('/').pop()||'unknown page';
  const box=document.getElementById('request');
  if(requested && requested!=='404.html'){
    box.style.display='block';
    box.textContent='Requested page: '+requested;
  }
  const ref=document.referrer;
  const back=document.getElementById('back');
  // Never redirect a missing page to an admin portal. Prefer the page the
  // user came from when it is on the same site; otherwise use login.
  try{
    if(ref && new URL(ref,location.href).origin===location.origin){
      back.href=ref;
      back.textContent='Return to Previous Page';
    }
  }catch(e){}
})();
</script>
</body>
</html>
