<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHTMS | Lecture Notes</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f7;color:#17302d}.wrap{max-width:1100px;margin:30px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #0000000b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd9d5;border-radius:9px;font:inherit}textarea{min-height:100px}button,.btn{border:0;background:#0b6b57;color:#fff;padding:11px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#e8f1ef;color:#17302d}.danger{background:#b42318}.status{padding:10px;border-radius:9px;margin-top:12px}.ok{background:#e8f7ee}.err{background:#fdecec}.muted{color:#60736f}.list{display:grid;gap:10px}.item{border:1px solid #dbe5e2;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item h3{margin:0 0 5px}.item p{margin:0;color:#60736f;font-size:13px}.tag{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f1ef;font-size:12px}.hidden{display:none}
</style></head><body><div class="wrap"><div class="top"><div><h1>Lecture Notes</h1><p class="muted">Publish learning materials to an assigned course. Only registered students for that course can access them.</p></div><a class="btn secondary" href="lecturer.html">Back to Lecturer Portal</a></div>
<section class="card"><h2>Publish a Lecture Note</h2><div class="grid"><div><label>Course</label><select id="course"><option value="">Loading assigned courses...</option></select></div><div><label>Title</label><input id="title" placeholder="e.g. Introduction to Anatomy"></div><div><label>Topic / Description</label><input id="description" placeholder="Optional short description"></div><div><label>Academic Session</label><input id="session" placeholder="e.g. 2026/2027"></div><div><label>Semester</label><select id="semester"><option value="First Semester">First Semester</option><option value="Second Semester">Second Semester</option></select></div><div><label>Document URL</label><input id="fileUrl" type="url" placeholder="https://..." required><small class="muted">Paste a shareable link to the PDF, DOC, DOCX, PPT or PPTX. Firebase Storage is not required.</small></div></div><div style="margin-top:14px"><button id="publish">Publish Note</button></div><div id="status"></div></section>
<section class="card"><div class="top"><h2>Notes You Published</h2><button class="secondary" id="refresh">Refresh</button></div><div id="notes" class="list"><p class="muted">Loading...</p></div></section></div>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import{getFirestore,doc,getDoc,collection,getDocs,query,where,addDoc,serverTimestamp,deleteDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDfHJaoVAeQ7KWWq71zn2bQOpR4Vot9v8c",authDomain:"smsh-282c0.firebaseapp.com",projectId:"smsh-282c0",storageBucket:"smsh-282c0.firebasestorage.app",messagingSenderId:"477828256463",appId:"1:477828256463:web:80a6755b679f585c73ddba"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),db=getFirestore(app);let me=null,lecturer=null,courses=[];const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function init(u){
const all=(await getDocs(collection(db,"courses"))).docs.map(d=>({id:d.id,...d.data()}));let userData=null;try{const ss=await getDocs(collection(db,"users"));userData=ss.docs.map(d=>({uid:d.id,...d.data()})).find(x=>String(x.role||"").toLowerCase()==="lecturer")}catch(e){}lecturer=userData||{uid:"development-mode",fullName:"Development Lecturer",role:"lecturer",active:true};me=lecturer;const ids=Array.isArray(lecturer.assignedCourseIds)?lecturer.assignedCourseIds:[];courses=ids.length?all.filter(c=>ids.includes(c.id)):all;$("course").innerHTML='<option value="">Select course</option>'+courses.map(c=>`<option value="${esc(c.id)}">${esc(c.code||"")} — ${esc(c.name||c.title||"")}</option>`).join("");await loadNotes()}
async function loadNotes(){const q=query(collection(db,"lectureNotes"),where("lecturerId","==",me.uid));const ss=await getDocs(q);const rows=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.createdAt?.seconds||0).localeCompare(String(a.createdAt?.seconds||0)));$("notes").innerHTML=rows.length?rows.map(n=>`<div class="item"><div><h3>${esc(n.title)}</h3><p>${esc(n.courseCode||"")} — ${esc(n.courseName||"")} <span class="tag">${esc(n.session||"")} • ${esc(n.semester||"")}</span></p><p>${esc(n.description||"")} • ${esc(n.fileName||"Document")}</p></div><div><a class="btn secondary" target="_blank" rel="noopener" href="${esc(n.fileUrl||"")}">Open</a> <button class="danger" data-id="${esc(n.id)}">Delete</button></div></div>`).join(""):'<p class="muted">No lecture notes published yet.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>removeNote(b.dataset.id))}
async function publish(){const c=courses.find(x=>x.id===$("course").value),title=$("title").value.trim(),url=$("fileUrl").value.trim(),session=$("session").value.trim(),semester=$("semester").value;if(!c||!title||!url||!session){$("status").textContent="Select a course and provide title, session and a document URL.";$("status").className="status err";return}let parsed;try{parsed=new URL(url)}catch(_){$("status").textContent="Please enter a valid document URL.";$("status").className="status err";return}if(!["http:","https:"].includes(parsed.protocol)){$("status").textContent="Document URL must start with http:// or https://.";$("status").className="status err";return}$("publish").disabled=true;$("status").textContent="Publishing note...";$("status").className="status";try{await addDoc(collection(db,"lectureNotes"),{title,description:$("description").value.trim(),lecturerId:me.uid,lecturerName:lecturer.fullName||lecturer.name||me.email||"Lecturer",courseId:c.id,courseCode:c.code||"",courseName:c.name||c.title||"",session,semester,fileName:"External document",fileUrl:url,documentUrl:url,sourceType:"external",createdAt:serverTimestamp()});$("status").textContent="Lecture note published successfully.";$("status").className="status ok";$("title").value="";$("description").value="";$("fileUrl").value="";await loadNotes()}catch(e){console.error(e);$("status").textContent=e.message||"Unable to publish lecture note.";$("status").className="status err"}finally{$("publish").disabled=false}}
async function removeNote(id){if(!confirm("Delete this lecture note?"))return;try{await deleteDoc(doc(db,"lectureNotes",id));await loadNotes()}catch(e){alert(e.message||"Unable to delete note.")}}
$("publish").onclick=publish;$("refresh").onclick=loadNotes;init({uid:"development-mode"}).catch(e=>{console.error(e);$("status").textContent=e.message||"Unable to load development mode."});
</script></body></html>
