<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Calendar | GGCHST Admin</title>
<style>
:root{--bg:#f3f8f5;--card:#fff;--text:#15352b;--muted:#668078;--line:#dce9e3;--brand:#087443;--brand2:#075c45;--soft:#e7f4ee;--danger:#b42318;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#075c45,#087443);color:white;padding:18px 20px;position:sticky;top:0;z-index:10}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center} h1{font-size:20px;margin:0} header p{margin:4px 0 0;opacity:.85;font-size:12px}
nav{background:#064b39;overflow:auto} nav .inner{max-width:1200px;margin:auto;display:flex;gap:4px;padding:8px 12px} nav a{color:#fff;text-decoration:none;padding:9px 11px;border-radius:8px;white-space:nowrap;font-size:13px} nav a:hover{background:#ffffff18}
main{max-width:1200px;margin:22px auto;padding:0 14px} .hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:20px} h3{margin:0 0 8px} .muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px} .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 16px #12321a0b}
form,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} label{font-size:12px;font-weight:700;display:block;margin-bottom:5px} input,select,textarea{width:100%;padding:10px;border:1px solid #cfded7;border-radius:9px;background:#fff;font:inherit} textarea{min-height:100px;resize:vertical}
.full{grid-column:1/-1} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} button,.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--brand);color:white;text-decoration:none;cursor:pointer;font-weight:700} .secondary{background:#e8f0ed;color:var(--text)} .danger{background:var(--danger)}
table{width:100%;border-collapse:collapse;background:#fff} th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top} th{background:#f1f7f4} .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.stat{font-size:28px;font-weight:800;color:var(--brand)} .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:11px;font-weight:700}
.toast{position:fixed;right:15px;bottom:15px;background:#15352b;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:30}
@media(max-width:650px){.fields{grid-template-columns:1fr} .head{align-items:flex-start;flex-direction:column}}


.school-header{
  background:#fff;
  color:#172033;
  padding:0;
  border-bottom:1px solid #e5e7eb;
  position:static;
}
.school-header-inner{
  max-width:1200px;
  min-height:82px;
  margin:0 auto;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:12px;
}
.school-logo{
  width:54px;
  height:54px;
  flex:0 0 54px;
  border-radius:50%;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#eefbf3;
  border:1px solid #d1fae5;
  color:#087443;
  font-weight:800;
}
.school-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.school-name{
  flex:1;
  color:#172033;
  font-size:18px;
  font-weight:800;
  line-height:1.25;
}
.school-name span{
  display:block;
  margin-top:3px;
  color:#667085;
  font-size:12px;
  font-weight:500;
}
.school-back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:#087443;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.school-back:hover{background:#075d36}
@media(max-width:650px){
  .school-header-inner{min-height:68px;padding:8px 10px;gap:9px}
  .school-logo{width:43px;height:43px;flex-basis:43px}
  .school-name{font-size:12px}
  .school-name span{font-size:10px}
  .school-back{padding:8px 9px;font-size:10px}
}

</style>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,addDoc,doc,setDoc,updateDoc,deleteDoc,onSnapshot,getDocs,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAoT3LGcdwA3FzHDrPEuhTNCnfiTklGXY",
  authDomain: "ggchst-sms-new.firebaseapp.com",
  projectId: "ggchst-sms-new",
  storageBucket: "ggchst-sms-new.firebasestorage.app",
  messagingSenderId: "942770190211",
  appId: "1:942770190211:web:aa9a085a38aaa517b368b6"
};

const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
window.GG={app,db,auth,collection,addDoc,doc,setDoc,updateDoc,deleteDoc,onSnapshot,getDocs,query,orderBy,limit};
window.toast=(m)=>{const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
window.esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
</script>
</head><body>
<header class="school-header">
  <div class="school-header-inner">
    <div class="school-logo">
      <img src="https://ggchstgusau.edu.ng/_next/image?q=75&url=%2Flogo.png&w=384"
           alt="Green Garden College of Health Sciences & Technology logo"
           onerror="this.style.display='none';this.parentElement.textContent='G';">
    </div>
    <div class="school-name">
      Green Garden College of Health Sciences &amp; Technology
      <span>Gusau, Zamfara State</span>
    </div>
    <a class="school-back" href="admin.html">← Back to Admin</a>
  </div>
</header>
<main>
<section class="hero"><h2>7. Academic Calendar</h2><p class="muted">Manage academic dates and events used to communicate sessions, registration, examinations and institutional deadlines.</p></section>
<form id="f"><div class="fields">
<div><label>Event title *</label><input id="title" required></div><div><label>Event type</label><select id="type"><option>Academic Session</option><option>Registration</option><option>Lecture</option><option>Examination</option><option>Holiday</option><option>Admission</option><option>Deadline</option><option>Other</option></select></div>
<div><label>Start</label><input id="start" type="datetime-local"></div><div><label>End</label><input id="end" type="datetime-local"></div>
<div><label>Session</label><input id="session"></div><div><label>Semester</label><input id="semester"></div><div class="full"><label>Description</label><textarea id="description"></textarea></div>
</div><div class="actions"><button>Save Calendar Event</button></div></form>
<div class="tablewrap"><table><thead><tr><th>Event</th><th>Type</th><th>Start</th><th>End</th><th>Session</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<script type="module">
const {db,collection,addDoc,deleteDoc,doc,onSnapshot}=window.GG;f.onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'academicCalendar'),{title:title.value,type:type.value,start:start.value,end:end.value,session:session.value,semester:semester.value,description:description.value,createdAt:new Date().toISOString()});f.reset();toast('Calendar event saved')};
onSnapshot(collection(db,'academicCalendar'),s=>{rows.innerHTML='';s.forEach(x=>{const d=x.data();rows.innerHTML+=`<tr><td>${esc(d.title)}</td><td>${esc(d.type)}</td><td>${esc(d.start)}</td><td>${esc(d.end)}</td><td>${esc(d.session)}</td><td><button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`})});
window.del=async id=>{if(confirm('Delete event?'))await deleteDoc(doc(db,'academicCalendar',id))};
</script>
</main><div id="toast" class="toast"></div>
</body></html>
