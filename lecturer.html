<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHTMS | Lecturer Portal</title><style>body{margin:0;font-family:Arial;background:#f4f8f7;color:#17302d}.wrap{max-width:1100px;margin:30px auto;padding:18px}.hero,.card{background:#fff;border-radius:16px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #0000000b}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.item{border:1px solid #dbe5e2;border-radius:12px;padding:14px}.item h3{margin:0 0 5px}.muted{color:#60736f}.btn{display:inline-block;padding:11px 15px;border-radius:9px;background:#0b6b57;color:#fff;text-decoration:none;margin:3px}.secondary{background:#e8f1ef;color:#17302d}</style></head><body><div class="wrap"><section class="hero"><div><h1 id="name">Lecturer Portal</h1><p id="meta" class="muted">Loading lecturer profile...</p></div><div><a class="btn" href="lecture-notes.html">Lecture Notes</a><a class="btn secondary" href="lecturer-management.html">Admin Management</a></div></section><section class="card"><h2>My Assigned Courses</h2><div id="courses" class="grid"><p class="muted">Loading...</p></div></section><section class="card"><h2>Teaching Tools</h2><a class="btn" href="lecture-notes.html">Publish Lecture Notes</a><a class="btn" href="assignments.html">Assignments</a><a class="btn" href="attendance.html">Attendance</a><a class="btn" href="result-entry.html">Result Entry</a><a class="btn" href="timetable.html">Timetable</a></section></div><script type="module">import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";const c={apiKey:"AIzaSyDfHJaoV7eQKWWq71zn2bQOpR4Vot9v8c",authDomain:"smsh-282c0.firebaseapp.com",projectId:"smsh-282c0",storageBucket:"smsh-282c0.firebasestorage.app",messagingSenderId:"477828256463",appId:"1:477828256463:web:80a6755b679f585c73ddba"};const app=getApps().length?getApp():initializeApp(c),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));onAuthStateChanged(auth,async u=>{if(!u){location.href="index.html";return}try{const s=await getDoc(doc(db,"users",u.uid));if(!s.exists())throw Error("Lecturer profile not found.");const d=s.data();if(String(d.role||'').toLowerCase()!=='lecturer'||d.active===false)throw Error("Access denied.");$("name").textContent=d.fullName||d.name||"Lecturer";$("meta").textContent=[d.staffId,d.faculty,d.department,d.discipline].filter(Boolean).join(" • ");const ids=Array.isArray(d.assignedCourseIds)?d.assignedCourseIds:[],all=(await getDocs(collection(db,"courses"))).docs.map(x=>({id:x.id,...x.data()})),cs=all.filter(x=>ids.includes(x.id));$("courses").innerHTML=cs.length?cs.map(x=>`<div class="item"><h3>${esc(x.code||'')} — ${esc(x.name||x.title||'Course')}</h3><div class="muted">${esc(x.creditUnit||'')} credit unit</div><a class="btn" href="lecture-notes.html">Notes</a></div>`).join(""):"<p class='muted'>No courses have been assigned yet.</p>"}catch(e){alert(e.message);location.href="index.html"}});</script></body></html>
