<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Settings | GCHST Admin</title>

<style>
:root{
  --bg:#f3f8f5;
  --card:#fff;
  --text:#15352b;
  --muted:#668078;
  --line:#dce9e3;
  --brand:#087443;
  --brand2:#075c45;
  --soft:#e7f4ee;
  --danger:#b42318;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================================================
   GUSAU THREE-PART HEADER
   1. SCHOOL IDENTITY
   2. PORTAL TITLE
   3. NAVIGATION
   ========================================================= */

.gusau-header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

/* ---------- PART 1: SCHOOL IDENTITY ---------- */

.school-bar{
  background:#fff;
  border-bottom:1px solid var(--line);
}

.school-bar-inner{
  max-width:1200px;
  margin:0 auto;
  min-height:70px;
  padding:10px 16px;

  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:13px;
}

.school-logo{
  width:48px;
  height:48px;
  object-fit:contain;
  display:block;
  flex:none;
}

.school-identity{
  min-width:0;
}

.school-name{
  margin:0;
  color:var(--text);
  font-size:17px;
  line-height:1.25;
  font-weight:800;
}

.school-location{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.3;
}

.header-home{
  justify-self:end;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 13px;
  border-radius:9px;
  background:var(--brand);
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.header-home:hover{
  background:var(--brand2);
}

/* ---------- PART 2: PORTAL TITLE ---------- */

.portal-bar{
  background:linear-gradient(135deg,#075c45,#087443);
  color:#fff;
  border-bottom:1px solid #064b39;
}

.portal-bar-inner{
  max-width:1200px;
  margin:0 auto;
  min-height:58px;
  padding:9px 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.portal-title-wrap{
  min-width:0;
}

.portal-title{
  margin:0;
  font-size:19px;
  font-weight:800;
  line-height:1.25;
}

.portal-subtitle{
  margin:3px 0 0;
  font-size:11px;
  opacity:.88;
  line-height:1.35;
}

.portal-badge{
  flex:none;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

/* ---------- PART 3: NAVIGATION ---------- */

.gusau-nav{
  background:#064b39;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}

.gusau-nav-inner{
  max-width:1200px;
  min-width:max-content;
  margin:0 auto;

  display:flex;
  align-items:center;
  gap:4px;

  padding:7px 12px;
}

.gusau-nav a{
  color:#fff;
  text-decoration:none;
  padding:9px 11px;
  border-radius:8px;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
  transition:.18s ease;
}

.gusau-nav a:hover{
  background:rgba(255,255,255,.10);
}

.gusau-nav a.active{
  background:#fff;
  color:var(--brand2);
}

/* =========================================================
   PAGE
   ========================================================= */

main{
  max-width:1200px;
  margin:22px auto;
  padding:0 14px;
}

.hero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin-bottom:16px;
}

h2{
  margin:0 0 6px;
  font-size:20px;
}

h3{
  margin:0 0 8px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 4px 16px #12321a0b;
}

form,
.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}

.fields{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

label{
  font-size:12px;
  font-weight:700;
  display:block;
  margin-bottom:5px;
}

input,
select,
textarea{
  width:100%;
  padding:10px;
  border:1px solid #cfded7;
  border-radius:9px;
  background:#fff;
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

button,
.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  background:var(--brand);
  color:white;
  text-decoration:none;
  cursor:pointer;
  font-weight:700;
}

.secondary{
  background:#e8f0ed;
  color:var(--text);
}

.danger{
  background:var(--danger);
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,
td{
  padding:9px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:12px;
  vertical-align:top;
}

th{
  background:#f1f7f4;
}

.tablewrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
}

.stat{
  font-size:28px;
  font-weight:800;
  color:var(--brand);
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:var(--soft);
  color:var(--brand2);
  font-size:11px;
  font-weight:700;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:#15352b;
  color:#fff;
  padding:12px 15px;
  border-radius:10px;
  display:none;
  z-index:300;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  .school-bar-inner{
    grid-template-columns:42px minmax(0,1fr) auto;
    min-height:64px;
    padding:8px 11px;
    gap:9px;
  }

  .school-logo{
    width:42px;
    height:42px;
  }

  .school-name{
    font-size:13px;
    line-height:1.22;
  }

  .school-location{
    font-size:9px;
    margin-top:2px;
  }

  .header-home{
    min-height:34px;
    padding:7px 9px;
    font-size:10px;
  }

  .portal-bar-inner{
    min-height:53px;
    padding:8px 12px;
    gap:8px;
  }

  .portal-title{
    font-size:16px;
  }

  .portal-subtitle{
    font-size:9px;
  }

  .portal-badge{
    padding:5px 8px;
    font-size:9px;
  }

  .gusau-nav-inner{
    padding:6px 9px;
  }

  .gusau-nav a{
    padding:8px 10px;
    font-size:11px;
  }

  main{
    margin:16px auto;
    padding:0 11px;
  }

  .hero{
    padding:16px;
  }

  .fields{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:430px){

  .school-bar-inner{
    grid-template-columns:38px minmax(0,1fr) auto;
  }

  .school-logo{
    width:38px;
    height:38px;
  }

  .school-name{
    font-size:11px;
  }

  .school-location{
    font-size:8px;
  }

  .header-home{
    font-size:9px;
    padding:6px 7px;
  }

  .portal-title{
    font-size:14px;
  }

  .portal-subtitle{
    font-size:8px;
  }

  .portal-badge{
    display:none;
  }
}
</style>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  setDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAoT3LGcdwA3FzHDrPEuhTNCnfiTklGXY",
  authDomain: "ggchst-sms-new.firebaseapp.com",
  projectId: "ggchst-sms-new",
  storageBucket: "ggchst-sms-new.firebasestorage.app",
  messagingSenderId: "942770190211",
  appId: "1:942770190211:web:aa9a085a38aaa517b368b6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.GG = {
  app,
  db,
  auth,
  collection,
  addDoc,
  doc,
  setDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  getDocs,
  query,
  orderBy,
  limit
};

window.toast = (m) => {
  const e = document.getElementById('toast');
  if(!e) return;

  e.textContent = m;
  e.style.display = 'block';

  clearTimeout(window.__toastTimer);

  window.__toastTimer = setTimeout(() => {
    e.style.display = 'none';
  },2600);
};

window.esc = (s='') =>
  String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
</script>
</head>

<body>

<!-- =======================================================
     GUSAU THREE-PART HEADER
     ======================================================= -->

<header class="gusau-header">

  <!-- PART 1: SCHOOL IDENTITY -->
  <div class="school-bar">
    <div class="school-bar-inner">

      <img
        class="school-logo"
        src="logo.png"
        alt="GGCHST Logo"
      >

      <div class="school-identity">
        <div class="school-name">
          Gusau College of Health Sciences &amp; Technology
        </div>

        <div class="school-location">
          Gusau, Zamfara State.
        </div>
      </div>

      <a class="header-home" href="admin.html">
        Back Admin
      </a>

    </div>
  </div>  

</header>


<!-- =======================================================
     PAGE CONTENT
     ======================================================= -->

<main>

<section class="hero">

  <h2>
    System Settings
  </h2>

</section>


<form id="f">

  <div class="fields">

    <div>
      <label>Institution name</label>
      <input id="schoolName">
    </div>

    <div>
      <label>Campus / address</label>
      <input id="address">
    </div>

    <div>
      <label>Current academic session</label>
      <input id="session">
    </div>

    <div>
      <label>Current semester</label>

      <select id="semester">
        <option>First</option>
        <option>Second</option>
        <option>Third</option>
      </select>

    </div>

    <div>
      <label>Grading system</label>

      <input
        id="grading"
        placeholder="A=70-100; B=60-69..."
      >
    </div>

    <div>
      <label>Registration open</label>

      <select id="registrationOpen">
        <option>true</option>
        <option>false</option>
      </select>

    </div>

    <div>
      <label>Payment currency</label>

      <input id="currency" value="NGN">
    </div>

    <div>
      <label>Notification mode</label>

      <select id="notificationMode">
        <option>In-app</option>
        <option>In-app + Email</option>
        <option>In-app + SMS</option>
      </select>

    </div>

    <div class="full">

      <label>
        General system note
      </label>

      <textarea id="note"></textarea>

    </div>

  </div>

  <div class="actions">

    <button type="submit">
      Save Settings
    </button>

  </div>

</form>


<section class="panel">

  <h3>
    Important
  </h3>

  <p class="muted">
    Client-side settings do not replace Firestore Security Rules.
    Role enforcement, result locking and financial controls must be
    enforced server-side.
  </p>

</section>

</main>


<div id="toast" class="toast"></div>


<!-- =======================================================
     SETTINGS LOGIC
     ======================================================= -->

<script type="module">

const {
  db,
  doc,
  setDoc,
  getDocs
} = window.GG;

const ref = doc(
  db,
  'systemSettings',
  'main'
);


/* LOAD SETTINGS */

(async()=>{

  try{

    const x = await getDocs(
      window.GG.collection(
        db,
        'systemSettings'
      )
    );

    const a = x.docs.find(
      d => d.id === 'main'
    );

    if(a){

      const d = a.data();

      for(
        const k of [
          'schoolName',
          'address',
          'session',
          'semester',
          'grading',
          'registrationOpen',
          'currency',
          'notificationMode',
          'note'
        ]
      ){

        const element =
          document.getElementById(k);

        if(element){
          element.value =
            d[k] ?? '';
        }

      }

    }

  }catch(error){

    console.error(
      'Unable to load system settings:',
      error
    );

    window.toast(
      'Could not load settings'
    );

  }

})();


/* SAVE SETTINGS */

document.getElementById('f').onsubmit =
async e => {

  e.preventDefault();

  try{

    await setDoc(
      ref,
      {
        schoolName:
          document.getElementById(
            'schoolName'
          ).value,

        address:
          document.getElementById(
            'address'
          ).value,

        session:
          document.getElementById(
            'session'
          ).value,

        semester:
          document.getElementById(
            'semester'
          ).value,

        grading:
          document.getElementById(
            'grading'
          ).value,

        registrationOpen:
          document.getElementById(
            'registrationOpen'
          ).value === 'true',

        currency:
          document.getElementById(
            'currency'
          ).value,

        notificationMode:
          document.getElementById(
            'notificationMode'
          ).value,

        note:
          document.getElementById(
            'note'
          ).value,

        updatedAt:
          new Date().toISOString()
      }
    );

    window.toast(
      'Settings saved'
    );

  }catch(error){

    console.error(
      'Unable to save system settings:',
      error
    );

    window.toast(
      'Settings could not be saved'
    );

  }

};

</script>

</body>
</html>
